# ============================================
# COMMIT: chore: add ruff config
# Причина: единый стиль кода, автоматическая проверка.
# Решение: ruff как линтер + форматтер.
# ============================================

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "venv", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S"]
ignore = ["E501", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "F401"]
